<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change the content of html with the help of javascript</title>
</head>

<body>

    <h1>Javascript change the content of html</h1>

    <p id="para">this is the paragraph tage in html</p>
    <!-- 1. tho aap ko html k content ko change kren k liye aap ko apne tag me koi na koi id ya phir class deni hoti hy etc. -->
    <!-- 2. jaise mene yaha pr id para di hy or phir oss ko me js getElementById kr rha ho aap ByName etc b kr sakty hy -->
    <button onclick='document.getElementById("para").innerHTML = "hello world" ''>Change Content</button>
    <!-- 1. onclick aik event hy jo k button k click hone pr aap k pass id ko fire karega or phir innerHTML k andar jayega or hello world ko print krdega jo k hum ne kiya howa hy etc.
    2. yaha pr hum ne single or double quotation ka use kiya howa hy q k aap do bar double ya phir single quotations ko aik sath use nhi kr sakty hy etc. -->

    
</body>
</html>
