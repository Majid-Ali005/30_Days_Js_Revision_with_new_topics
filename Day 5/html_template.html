<!DOCTYPE html>
<html>
<body>
  <div id="container"></div>
  <script>
    let users = [
      { name: "Alice", age: 25 },
      { name: "Bob", age: 30 }
    ];
    let html = `
      <ul>
        ${users.map(user => `
          <li>${user.name} (Age: ${user.age})</li>
        `).join("")}
      </ul>
    `;
    document.getElementById("container").innerHTML = html;
  </script>
</body>
</html>
